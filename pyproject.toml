[project]
name = "apex-ngin2dos"
version = "1.0.1"
description = "Multi-variant HTTP/2 HPACK benchmark harness (authorized research only)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmark"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
