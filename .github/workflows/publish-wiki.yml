name: Publish wiki
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-wiki
  cancel-in-progress: true
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki
          strategy: init
