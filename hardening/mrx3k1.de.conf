# Site-Snippet: mrx3k1.de — nach /etc/nginx/sites-available/mrx3k1.de
# Bestehenden server { }-Block ergänzen, nicht blind ersetzen.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrx3k1.de www.mrx3k1.de;

    # TLS — bestehende Zertifikate beibehalten
    # ssl_certificate     /etc/letsencrypt/live/mrx3k1.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mrx3k1.de/privkey.pem;

    # === HPACK-Bomb Härtung (pro Server) ===
    limit_conn h2_conn_per_ip 20;      # max parallele Verbindungen/IP
    limit_req  zone=h2_req_per_ip burst=60 nodelay;

    http2_max_concurrent_streams 32;

    # Strengere Timeouts auf Site-Ebene
    keepalive_timeout 15s;
    send_timeout      15s;

    # ... bestehende root/location-Konfiguration ...
    # location / { ... }
}

# Notfall-Variante (HTTP/2 komplett aus, bis nginx >= 1.29.8):
# Ersetze "listen 443 ssl http2;" durch:
#   listen 443 ssl;
#   listen [::]:443 ssl;
# Kein http2 → Angriff vektor HTTP/1.1 only (HPACK-Bomb unmöglich).
