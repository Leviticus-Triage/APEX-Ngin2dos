# HTTP/2 HPACK-Bomb Härtung — mrx3k1.de / 69.62.121.168
# nginx 1.24.0 (Ubuntu) — Defense-in-Depth bis Upgrade auf >= 1.29.8
#
# Einbinden in /etc/nginx/nginx.conf innerhalb http { }:
#   include /etc/nginx/conf.d/http2-bomb-hardening.conf;
#
# Oder per site: include snippets/http2-bomb-hardening.conf;

# --- Connection / Rate Limits (pro IP) ---
limit_conn_zone $binary_remote_addr zone=h2_conn_per_ip:16m;
limit_req_zone  $binary_remote_addr zone=h2_req_per_ip:16m rate=30r/s;

# --- HTTP/2 stream ceiling (Default 128 — Angriff nutzt 128 Streams/Conn) ---
http2_max_concurrent_streams 32;

# --- Header budget enger (Default 4x8k=32k — Bomb nutzt genau dieses Limit) ---
# Reduziert max. Header-Anzahl indirekt; allein nicht ausreichend, aber Bremse.
large_client_header_buffers 2 4k;

# --- Window-Stall: kürzere Timeouts → gehaltene Streams fallen schneller weg ---
keepalive_timeout   15s;
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;   # default 60s — Drip hält sonst ewig

# --- Optional: recv buffer kleiner halten ---
http2_body_preread_size 64k;

# --- Map: verdächtig viele gleichzeitige H2-Verbindungen loggen ---
# (nur Logging — kein Block; limit_conn macht das)
