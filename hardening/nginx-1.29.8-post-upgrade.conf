# Nach Upgrade auf nginx >= 1.29.8 — primärer Fix laut califio/publications
# https://github.com/nginx/nginx/commit/365694160a85229a7cb006738de9260d49ff5fa2

http {
    # Explizites Header-Count-Limit (neutralisiert HPACK indexed-ref bomb)
    http2_max_headers 100;

    # Weiterhin Defense-in-Depth:
    http2_max_concurrent_streams 64;
    limit_conn_zone $binary_remote_addr zone=h2_conn_per_ip:16m;
}

server {
    listen 443 ssl http2;
    server_name mrx3k1.de www.mrx3k1.de;

    limit_conn h2_conn_per_ip 30;
    http2_max_headers 100;
}
